name: Check Tistory title

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-tistory-title.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch title
        run: |
          python - <<'PY'
          import urllib.request, re, html
          url='https://upcurvewave.tistory.com/864'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(req, timeout=20).read().decode('utf-8','ignore')
          m=re.search(r'<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)["\']', data, re.I)
          if not m:
              m=re.search(r'<title>(.*?)</title>', data, re.I|re.S)
          print('TITLE:', html.unescape(m.group(1).strip()) if m else 'NOT_FOUND')
          PY
