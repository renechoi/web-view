name: Fetch Gatsby cover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-gatsby-cover.yml"

permissions:
  contents: write

jobs:
  fetch-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official cover
        run: |
          mkdir -p blog-contents/book-club/moon-yeolbyeong
          curl -fL --retry 3 -A "Mozilla/5.0" \
            "https://www.eulyoo.co.kr/sedit/upload_books/1602648661814.jpg" \
            -o blog-contents/book-club/moon-yeolbyeong/2026-03-great-gatsby.jpg
          file blog-contents/book-club/moon-yeolbyeong/2026-03-great-gatsby.jpg
          test -s blog-contents/book-club/moon-yeolbyeong/2026-03-great-gatsby.jpg

      - name: Commit cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-contents/book-club/moon-yeolbyeong/2026-03-great-gatsby.jpg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Great Gatsby cover for Tistory book club post"
            git push
          fi
