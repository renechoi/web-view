name: Fetch Great Expectations covers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-great-expectations-covers.yml"

permissions:
  contents: write

jobs:
  fetch-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download covers
        run: |
          mkdir -p blog-contents/book-club/moon-yeolbyeong
          curl -fL --retry 3 -A "Mozilla/5.0" \
            "https://image.yes24.com/goods/3452419/XL" \
            -o blog-contents/book-club/moon-yeolbyeong/2026-07-great-expectations-1.jpg
          curl -fL --retry 3 -A "Mozilla/5.0" \
            "https://image.yes24.com/goods/3452423/XL" \
            -o blog-contents/book-club/moon-yeolbyeong/2026-07-great-expectations-2.jpg
          file blog-contents/book-club/moon-yeolbyeong/2026-07-great-expectations-1.jpg
          file blog-contents/book-club/moon-yeolbyeong/2026-07-great-expectations-2.jpg
          test "$(stat -c%s blog-contents/book-club/moon-yeolbyeong/2026-07-great-expectations-1.jpg)" -gt 5000
          test "$(stat -c%s blog-contents/book-club/moon-yeolbyeong/2026-07-great-expectations-2.jpg)" -gt 5000

      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-contents/book-club/moon-yeolbyeong/2026-07-great-expectations-1.jpg
          git add blog-contents/book-club/moon-yeolbyeong/2026-07-great-expectations-2.jpg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Great Expectations covers for Tistory book club post"
            git push
          fi
