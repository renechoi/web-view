name: Fetch Unbearable Lightness cover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-unbearable-lightness-cover.yml"

permissions:
  contents: write

jobs:
  fetch-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download cover
        run: |
          mkdir -p blog-contents/book-club/moon-yeolbyeong
          curl -fL --retry 3 -A "Mozilla/5.0" \
            "https://image.yes24.com/goods/61933303/XL" \
            -o blog-contents/book-club/moon-yeolbyeong/2026-05-unbearable-lightness.jpg
          file blog-contents/book-club/moon-yeolbyeong/2026-05-unbearable-lightness.jpg
          test -s blog-contents/book-club/moon-yeolbyeong/2026-05-unbearable-lightness.jpg
          test "$(stat -c%s blog-contents/book-club/moon-yeolbyeong/2026-05-unbearable-lightness.jpg)" -gt 5000

      - name: Commit cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-contents/book-club/moon-yeolbyeong/2026-05-unbearable-lightness.jpg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Unbearable Lightness cover for Tistory book club post"
            git push
          fi
